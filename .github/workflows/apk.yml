name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Eski depoda v1.0.10'a kadar çıkıldı; numaralar oradan devam eder.
      SURUM_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Sürüm numarası
        run: |
          N=$((SURUM_NO + 10))
          echo "KOD=$N" >> $GITHUB_ENV
          echo "SURUM=1.0.$N" >> $GITHUB_ENV

      - name: Android proje dosyalarını oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --org com.kones --project-name on_muhasebe --platforms android .
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="on_muhasebe"#android:label="Ön Muhasebe"#' $M
          # WhatsApp bildirim dinleyici servisi
          grep -q 'WaDinleyici' $M || sed -i 's#</application>#    <service android:name=".WaDinleyici" android:label="Ön Muhasebe WhatsApp" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService"/>\n            </intent-filter>\n        </service>\n    </application>#' $M
          # Kotlin dosyaları (MainActivity + WaDinleyici)
          K=android/app/src/main/kotlin/com/kones/on_muhasebe
          mkdir -p $K
          cp android_ek/kotlin/*.kt $K/
          # Firebase en az Android 7 (API 24) ister
          G=android/app/build.gradle.kts
          [ -f $G ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(24, flutter.minSdkVersion)/' $G || true
          cat $M

      - name: İmza şifresi kontrolü
        env:
          ONMUHASEBE_KEYSTORE_PASSWORD: ${{ secrets.ONMUHASEBE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ONMUHASEBE_KEYSTORE_PASSWORD" ]; then
            echo "::error::ONMUHASEBE_KEYSTORE_PASSWORD gizli ayarı eksik. GitHub → Settings → Secrets and variables → Actions bölümünden ekleyin."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --build-name=$SURUM --build-number=$KOD

      # Gradle her derlemede geçici bir anahtar üretiyor; APK burada her zaman
      # aynı anahtarla (imza/on-muhasebe.p12) yeniden imzalanır ve doğrulanır.
      # Böylece yeni sürümler eskisinin üzerine kurulabilir.
      - name: APK'yı sabit anahtarla imzala ve doğrula
        env:
          ONMUHASEBE_KEYSTORE_PASSWORD: ${{ secrets.ONMUHASEBE_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          A=build/app/outputs/flutter-apk
          "$BT/apksigner" sign --ks imza/on-muhasebe.p12 --ks-type PKCS12 \
            --ks-pass env:ONMUHASEBE_KEYSTORE_PASSWORD --key-pass env:ONMUHASEBE_KEYSTORE_PASSWORD \
            --ks-key-alias onmuhasebe --out $A/imzali.apk $A/app-release.apk
          mv $A/imzali.apk $A/app-release.apk
          "$BT/apksigner" verify --print-certs $A/app-release.apk | tee imza.txt
          grep -q "CN=On Muhasebe" imza.txt || { echo "::error::APK doğru anahtarla imzalanmadı"; exit 1; }

      - name: APK'yı sakla
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: on-muhasebe-${{ env.SURUM }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.SURUM }}
          name: Ön Muhasebe v${{ env.SURUM }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Deneme sürümü (main dışı dallar)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: deneme-${{ github.run_number }}
          name: Deneme ${{ env.SURUM }} (${{ github.ref_name }})
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
