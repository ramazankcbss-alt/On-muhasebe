name: on_muhasebe
description: Kones Mühendislik ön muhasebe (EBS Ticari benzeri) Android uygulaması
publish_to: 'none'
version: 1.0.11+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: any
  excel: 4.0.6
  archive: any
  file_picker: ^10.3.2
  share_plus: ^10.1.4
  webview_flutter: ^4.10.0
  # Bulut eşitleme (giriş + Firestore)
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_auth: '>=5.3.0 <8.0.0'
  cloud_firestore: '>=5.4.0 <8.0.0'
  # Güncelleme denetimi
  package_info_plus: '>=8.0.0 <11.0.0'
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
